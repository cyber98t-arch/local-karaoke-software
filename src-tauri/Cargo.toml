[package]
name = "hibiki-karaoke"
version = "0.1.0"
description = "Windows-first local AI karaoke"
authors = ["Hibiki contributors"]
edition = "2021"

[lib]
name = "hibiki_karaoke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.18.2"
lofty = { version = "0.25.4", default-features = false, features = ["id3v2_compression_support"] }
ndarray = "=0.17.2"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["api-31", "copy-dylibs", "download-binaries", "ndarray", "std", "tls-rustls"] }
realfft = "=3.5.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

