[package]
name = "hibiki-karaoke"
version = "0.1.0"
description = "Windows-first local AI karaoke"
authors = ["Hibiki contributors"]
edition = "2021"

[lib]
name = "hibiki_karaoke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

